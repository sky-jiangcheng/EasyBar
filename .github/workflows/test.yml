name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # swift test needs the full Xcode toolchain: XCTest and its runner are
      # not part of Command Line Tools, and SwiftUI macro plugins ship with
      # Xcode only. macos-15 runners already have Xcode selected; the explicit
      # switch keeps that guarantee stable.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run unit tests
        run: swift test
